---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: clustermodels.fusioninfer.io
spec:
  group: fusioninfer.io
  names:
    kind: ClusterModel
    listKind: ClusterModelList
    plural: clustermodels
    singular: clustermodel
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterModel declares a cluster-scoped model artifact.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec declares the model artifact.
            properties:
              lora:
                description: LoRA identifies this artifact as a LoRA adapter and names
                  its Base Model.
                properties:
                  baseModelRef:
                    description: BaseModelRef identifies the compatible base model.
                    properties:
                      kind:
                        description: Kind is the referenced resource kind.
                        enum:
                        - Model
                        - ClusterModel
                        type: string
                      name:
                        description: Name is the referenced resource name.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                required:
                - baseModelRef
                type: object
                x-kubernetes-validations:
                - message: lora is immutable
                  rule: self == oldSelf
              prefetch:
                description: |-
                  Prefetch declares the nodes to download the model to before it is needed.
                  When omitted, the model is downloaded on demand.
                properties:
                  nodeName:
                    description: NodeName selects a single node by name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector selects the nodes whose labels match
                      all of the given labels.
                    minProperties: 1
                    type: object
                type: object
                x-kubernetes-validations:
                - message: nodeSelector and nodeName are mutually exclusive
                  rule: '!(has(self.nodeSelector) && has(self.nodeName))'
              source:
                description: Source identifies where the model artifact is stored.
                properties:
                  credentialsRef:
                    description: |-
                      CredentialsRef names the Secret used to access the source.
                      When omitted, the source is accessed anonymously.
                    properties:
                      name:
                        description: Name is the name of the Secret.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                  uri:
                    description: |-
                      URI is the model artifact location. The version, when present, is part of the URI:
                      hf://<owner>/<repo>[@<revision>], s3://<bucket>/<prefix>, or
                      oci://<registry>/<repository>[:<tag>|@sha256:<digest>].
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: uri is immutable
                      rule: self == oldSelf
                    - message: uri must use a supported lowercase scheme and identify
                        an artifact
                      rule: self.matches('^(hf|s3|oci)://.+$')
                    - message: uri must use valid URI characters; encode spaces and
                        non-ASCII characters
                      rule: self.matches('^[A-Za-z0-9._~:/@!$&()*+,;=%-]+$')
                    - message: uri must not contain a query string or fragment
                      rule: '!self.contains(''?'') && !self.contains(''#'')'
                    - message: uri must not contain dot path segments
                      rule: '!self.contains(''/./'') && !self.contains(''/../'') &&
                        !self.endsWith(''/.'') && !self.endsWith(''/..'')'
                    - message: uri must not percent-encode dots or slashes
                      rule: '!self.matches(''%2[eEfF]'')'
                    - message: hf uri must be hf://<owner>/<repo> with an optional
                        @<revision>
                      rule: '!self.startsWith(''hf://'') || (self.matches(''^hf://[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?/[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?(@[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)?$'')
                        && !self.contains(''..''))'
                    - message: s3 uri must be s3://<bucket>/<prefix>
                      rule: '!self.startsWith(''s3://'') || self.matches(''^s3://[^/@:]+/[^/]+(/[^/]+)*$'')'
                    - message: oci uri must be oci://<registry>/<repository> with
                        an optional :<tag> or @sha256:<digest>
                      rule: '!self.startsWith(''oci://'') || self.matches(''^oci://[A-Za-z0-9.-]+(:[0-9]+)?/[a-z0-9]+(([.]|__|_|-+)[a-z0-9]+)*(/[a-z0-9]+(([.]|__|_|-+)[a-z0-9]+)*)*(:[A-Za-z0-9_][A-Za-z0-9._-]{0,127}|@sha256:[0-9a-f]{64})?$'')'
                required:
                - uri
                type: object
            required:
            - source
            type: object
            x-kubernetes-validations:
            - message: lora cannot be added or removed
              rule: has(self.lora) == has(oldSelf.lora)
          status:
            description: Status reports source accessibility and prefetch progress.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the model's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              prefetch:
                description: Prefetch reports download progress on the nodes selected
                  by spec.prefetch.
                properties:
                  desiredNodes:
                    description: DesiredNodes is the number of nodes selected by prefetch.
                    format: int32
                    minimum: 0
                    type: integer
                  failedNodes:
                    description: FailedNodes is the number of selected nodes that
                      failed to download the model.
                    format: int32
                    minimum: 0
                    type: integer
                  readyNodes:
                    description: ReadyNodes is the number of selected nodes that have
                      downloaded the model.
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - desiredNodes
                - failedNodes
                - readyNodes
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: cluster-scoped LoRA artifacts must reference a ClusterModel
          rule: '!has(self.spec.lora) || self.spec.lora.baseModelRef.kind == ''ClusterModel'''
    served: true
    storage: true
    subresources:
      status: {}
